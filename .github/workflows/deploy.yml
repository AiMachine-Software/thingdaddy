name: Build and deploy production site

# Builds the React apps + legacy pages into dist/ and publishes dist/ to GitHub
# Pages. Runs on every push to `production`. See web/build-site.mjs for layout.
#
# Repository variables (Settings -> Secrets and variables -> Actions -> Variables):
#   API_BASE   origin of a hosted population API, e.g. https://api.example.com
#              Leave unset until the API is hosted; the population UI then shows
#              "cannot reach the population API" instead of guessing an origin.

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: write   # publishes dist/ into branch `main`, which Pages serves (legacy source mode)

concurrency:
  group: pages
  cancel-in-progress: true

# Pages on this repo is configured as "Deploy from a branch: main /" (changing it needs
# admin on the org). So the build job publishes dist/ into `main`; Pages then builds from
# it as before. `production` stays the source branch. Switch back to actions/deploy-pages
# once the Pages source is set to "GitHub Actions".
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Served at https://<org>.github.io/thingdaddy/ -> assets must be prefixed.
          VITE_BASE: /thingdaddy
          VITE_API_BASE: ${{ vars.API_BASE }}
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: main
          force_orphan: true
          commit_message: "site: build from production ${{ github.sha }}"
