# Include this INSIDE the nginx `server { }` block that serves the static site at
# http://49.0.64.117/thingdaddy/  (the default server). It forwards the API's
# root-relative paths to the API container (deploy/docker-compose.yml, 127.0.0.1:8789),
# so the React app (same-origin API) and the /demo pages (const API = '') work.
#
#   sudo cp ~/thingdaddy/deploy/server/thingdaddy-api-proxy.conf /etc/nginx/snippets/thingdaddy-api-proxy.conf
#   # then inside the default server block:   include snippets/thingdaddy-api-proxy.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# Route list = app.get/app.post in apps/api/server.js. Add a name here when a new route family appears.
location ~ ^/(health|stats|search|record|node|party|prefix|claims|containment|estate|exceptions|verified|agent|asset|claim|gate|ingest)(/|$) {
    proxy_pass         http://127.0.0.1:8789;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
