# nginx reverse proxy for the ThingDaddy demo stack (deploy/docker-compose.yml).
# The container serves API + web app from one origin on 127.0.0.1:8789.
#
#   sudo cp deploy/server/thingdaddy.nginx.conf /etc/nginx/sites-available/thingdaddy
#   sudo ln -s /etc/nginx/sites-available/thingdaddy /etc/nginx/sites-enabled/thingdaddy
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d td-demo.49.0.64.117.nip.io      # https, same pattern as field-mark
#
# Change server_name to the hostname you want (any *.<public-ip>.nip.io resolves without DNS).
server {
    listen 80;
    server_name td-demo.49.0.64.117.nip.io;

    client_max_body_size 20m;

    location / {
        proxy_pass         http://127.0.0.1:8789;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
